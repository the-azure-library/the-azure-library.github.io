<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script>
  /* Áp lựa chọn ngày/đêm đã lưu trước khi trang vẽ, để không bị nháy màu */
  (function () {
    try {
      var saved = localStorage.getItem("tq-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", "thuquan-" + saved);
      }
    } catch (e) {}
  })();
</script>
